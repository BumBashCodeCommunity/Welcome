<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power of Html, Css & Js | August 2026 | Join Us</title>
    <style>
        :root {
            --neon-green: #00ff41;
            --neon-cyan: #00e5ff;
            --neon-magenta: #ff00e5;
            --dark-bg: #050508;
            --card-bg: #0a0a10;
            --glow-green: 0 0 10px #00ff41, 0 0 30px #00ff4180, 0 0 60px #00ff4130;
            --glow-cyan: 0 0 10px #00e5ff, 0 0 30px #00e5ff80, 0 0 60px #00e5ff30;
            --glow-magenta: 0 0 10px #ff00e5, 0 0 30px #ff00e580;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--dark-bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Courier New', 'Consolas', 'Monaco', 'Lucida Console', monospace;
            overflow: hidden;
            cursor: crosshair;
            user-select: none;
            -webkit-user-select: none;
            position: relative;
        }

        /* Matrix rain canvas */
        #matrixCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            opacity: 0.7;
        }

        /* Scanlines */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            background: repeating-linear-gradient(0deg,
                    transparent,
                    transparent 2px,
                    rgba(0, 0, 0, 0.06) 2px,
                    rgba(0, 0, 0, 0.06) 4px);
        }

        /* CRT flicker */
        .crt-flicker {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none;
            background: transparent;
            animation: crtFlicker 0.15s infinite alternate;
            opacity: 0;
        }

        @keyframes crtFlicker {
            0%,
            95% {
                opacity: 0;
            }
            96% {
                opacity: 0.03;
            }
            97% {
                opacity: 0;
            }
            98% {
                opacity: 0.04;
            }
            100% {
                opacity: 0;
            }
        }

        /* Vignette */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 4;
            pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.7) 100%);
        }

        /* Floating particles */
        .particles-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none;
        }
        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: var(--neon-green);
            border-radius: 50%;
            box-shadow: 0 0 6px var(--neon-green), 0 0 12px var(--neon-green);
            animation: floatUp linear infinite;
            opacity: 0;
        }
        .particle.cyan {
            background: var(--neon-cyan);
            box-shadow: 0 0 6px var(--neon-cyan), 0 0 12px var(--neon-cyan);
        }
        .particle.magenta {
            background: var(--neon-magenta);
            box-shadow: 0 0 6px var(--neon-magenta), 0 0 12px var(--neon-magenta);
        }
        @keyframes floatUp {
            0% {
                transform: translateY(0) translateX(0) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
                transform: translateY(-20px) translateX(5px) scale(1.5);
            }
            30% {
                transform: translateY(-80px) translateX(-10px) scale(1);
                opacity: 0.8;
            }
            60% {
                transform: translateY(-180px) translateX(15px) scale(0.6);
                opacity: 0.4;
            }
            100% {
                transform: translateY(-350px) translateX(-5px) scale(0);
                opacity: 0;
            }
        }

        /* Card wrapper */
        .card-wrapper {
            position: relative;
            z-index: 10;
            perspective: 1200px;
            padding: 20px;
        }

        /* The invitation card */
        .card {
            position: relative;
            width: 600px;
            max-width: 94vw;
            min-height: 420px;
            background: var(--card-bg);
            border: 2px solid #00ff4130;
            border-radius: 20px;
            padding: 35px 35px 25px;
            overflow: hidden;
            transition: transform 0.15s ease-out, box-shadow 0.3s ease;
            box-shadow: 0 0 15px #00ff4120, 0 0 40px #00ff4110, 0 20px 60px rgba(0, 0, 0, 0.6), inset 0 0 80px rgba(0, 255, 65, 0.02);
            transform-style: preserve-3d;
        }
        .card:hover {
            box-shadow: 0 0 25px #00ff4130, 0 0 60px #00ff4120, 0 0 100px #00e5ff15, 0 25px 70px rgba(0, 0, 0, 0.7), inset 0 0 100px rgba(0, 255, 65, 0.04);
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(rgba(0, 255, 65, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 65, 0.03) 1px, transparent 1px);
            background-size: 20px 20px;
            pointer-events: none;
            z-index: 0;
            border-radius: 20px;
        }
        .card::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg,
                    transparent 0deg,
                    transparent 120deg,
                    rgba(0, 255, 65, 0.04) 130deg,
                    rgba(0, 229, 255, 0.04) 140deg,
                    transparent 150deg,
                    transparent 360deg);
            animation: shimmerRotate 8s linear infinite;
            pointer-events: none;
            z-index: 0;
            border-radius: 20px;
        }
        @keyframes shimmerRotate {
            to {
                transform: rotate(360deg);
            }
        }

        /* Border glow */
        .card-border-glow {
            position: absolute;
            top: -3px;
            left: -3px;
            right: -3px;
            bottom: -3px;
            border-radius: 22px;
            background: transparent;
            z-index: -1;
            pointer-events: none;
            box-shadow: 0 0 8px var(--neon-green), 0 0 20px #00ff4160, 0 0 45px #00ff4125;
            animation: borderPulse 3s ease-in-out infinite;
        }
        @keyframes borderPulse {
            0%,
            100% {
                box-shadow: 0 0 8px var(--neon-green), 0 0 20px #00ff4160, 0 0 45px #00ff4125;
            }
            50% {
                box-shadow: 0 0 18px var(--neon-green), 0 0 35px #00ff4180, 0 0 70px #00e5ff40, 0 0 90px #00ff4120;
            }
        }

        /* Corner brackets */
        .corner-bracket {
            position: absolute;
            width: 30px;
            height: 30px;
            z-index: 2;
            pointer-events: none;
        }
        .corner-bracket::before,
        .corner-bracket::after {
            content: '';
            position: absolute;
            background: var(--neon-green);
            box-shadow: 0 0 6px var(--neon-green);
        }
        .corner-bracket.top-left {
            top: 12px;
            left: 12px;
        }
        .corner-bracket.top-right {
            top: 12px;
            right: 12px;
        }
        .corner-bracket.bottom-left {
            bottom: 12px;
            left: 12px;
        }
        .corner-bracket.bottom-right {
            bottom: 12px;
            right: 12px;
        }
        .corner-bracket.top-left::before,
        .corner-bracket.top-right::before {
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
        }
        .corner-bracket.top-left::after,
        .corner-bracket.top-right::after {
            top: 0;
            left: 0;
            width: 2px;
            height: 100%;
        }
        .corner-bracket.bottom-left::before,
        .corner-bracket.bottom-right::before {
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
        }
        .corner-bracket.bottom-left::after,
        .corner-bracket.bottom-right::after {
            bottom: 0;
            right: 0;
            width: 2px;
            height: 100%;
        }
        .corner-bracket.top-right::before,
        .corner-bracket.bottom-right::before {
            left: auto;
            right: 0;
        }
        .corner-bracket.top-right::after {
            left: auto;
            right: 0;
        }
        .corner-bracket.bottom-left::after {
            right: auto;
            left: 0;
        }

        /* Card content */
        .card-content {
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            height: 100%;
        }

        /* Chip decoration */
        .chip-decoration {
            position: absolute;
            top: 20px;
            left: 25px;
            width: 45px;
            height: 35px;
            border: 2px solid #00ff4160;
            border-radius: 6px;
            background: linear-gradient(135deg, #0a0a15, #111122);
            box-shadow: inset 0 0 10px rgba(0, 255, 65, 0.1), 0 0 8px rgba(0, 255, 65, 0.2);
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .chip-decoration::after {
            content: '';
            width: 20px;
            height: 14px;
            border: 1px solid #00ff4180;
            border-radius: 3px;
            background: rgba(0, 255, 65, 0.05);
        }
        .chip-lines {
            position: absolute;
            top: 20px;
            left: 78px;
            z-index: 2;
            display: flex;
            gap: 3px;
        }
        .chip-lines span {
            display: block;
            width: 2px;
            height: 35px;
            background: #00ff4130;
            box-shadow: 0 0 4px #00ff4120;
            border-radius: 1px;
        }

        /* Glitch text */
        .glitch-container {
            position: relative;
            display: inline-block;
            margin-top: 5px;
        }
        .glitch-text {
            font-size: 1.65rem;
            font-weight: bold;
            color: var(--neon-green);
            text-shadow: var(--glow-green);
            letter-spacing: 2px;
            position: relative;
            display: inline-block;
            text-transform: uppercase;
            line-height: 1.2;
        }
        .glitch-text.clone-cyan,
        .glitch-text.clone-magenta {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .glitch-text.clone-cyan {
            color: var(--neon-cyan);
            text-shadow: var(--glow-cyan);
            clip-path: inset(0 0 60% 0);
            animation: glitchCyan 4s infinite steps(1);
            z-index: -1;
        }
        .glitch-text.clone-magenta {
            color: var(--neon-magenta);
            text-shadow: var(--glow-magenta);
            clip-path: inset(40% 0 0 0);
            animation: glitchMagenta 4s infinite steps(1);
            z-index: -2;
        }
        @keyframes glitchCyan {
            0%,
            92%,
            96%,
            100% {
                transform: translate(0, 0);
                opacity: 0;
            }
            93% {
                transform: translate(-3px, 2px);
                opacity: 0.7;
            }
            94% {
                transform: translate(2px, -1px);
                opacity: 0.9;
            }
            95% {
                transform: translate(-1px, -2px);
                opacity: 0.5;
            }
        }
        @keyframes glitchMagenta {
            0%,
            90%,
            94%,
            100% {
                transform: translate(0, 0);
                opacity: 0;
            }
            91% {
                transform: translate(3px, -1px);
                opacity: 0.7;
            }
            92% {
                transform: translate(-2px, 2px);
                opacity: 0.8;
            }
            93% {
                transform: translate(1px, -2px);
                opacity: 0.6;
            }
        }

        /* Byline */
        .byline {
            font-size: 0.95rem;
            color: var(--neon-cyan);
            text-shadow: 0 0 8px #00e5ff80;
            letter-spacing: 3px;
            margin-top: 2px;
            position: relative;
        }
        .byline .blink-cursor {
            display: inline-block;
            width: 8px;
            height: 16px;
            background: var(--neon-cyan);
            margin-left: 3px;
            vertical-align: middle;
            animation: blink 0.8s step-end infinite;
            box-shadow: 0 0 8px var(--neon-cyan);
        }
        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        /* Divider */
        .divider {
            width: 70%;
            height: 1px;
            background: linear-gradient(90deg, transparent, #00ff4160, #00e5ff80, #00ff4160, transparent);
            margin: 18px 0;
            box-shadow: 0 0 8px #00ff4130;
            position: relative;
        }
        .divider::after {
            content: '◆';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--neon-green);
            font-size: 0.5rem;
            text-shadow: 0 0 8px var(--neon-green);
            background: var(--card-bg);
            padding: 0 10px;
        }

        /* Invitation message */
        .invite-message {
            font-size: 1.1rem;
            color: #00ff41cc;
            text-shadow: 0 0 8px #00ff4160;
            letter-spacing: 1.5px;
            margin: 5px 0 10px;
            line-height: 1.5;
        }
        .invite-message span.prompt {
            color: var(--neon-green);
            font-weight: bold;
        }
        .invite-message .wave {
            display: inline-block;
            animation: wave 1s infinite;
        }
        @keyframes wave {
            0%,
            100% {
                transform: rotate(0deg);
            }
            25% {
                transform: rotate(15deg);
            }
            75% {
                transform: rotate(-15deg);
            }
        }

        /* Fellows mention */
        .fellows-line {
            font-size: 0.85rem;
            color: #00e5ff90;
            margin-bottom: 15px;
            letter-spacing: 2px;
            text-shadow: 0 0 5px #00e5ff40;
        }

        /* WhatsApp button */
        .join-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 28px;
            background: rgba(0, 255, 65, 0.05);
            border: 2px solid #00ff41;
            border-radius: 8px;
            color: #00ff41;
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-decoration: none;
            text-shadow: 0 0 8px #00ff41;
            box-shadow: 0 0 15px #00ff4130, inset 0 0 15px #00ff4110;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            margin: 8px 0 12px;
            font-family: inherit;
        }
        .join-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 65, 0.2), transparent);
            transition: left 0.6s ease;
        }
        .join-btn:hover {
            background: rgba(0, 255, 65, 0.12);
            box-shadow: 0 0 30px #00ff41, 0 0 60px #00ff4140, inset 0 0 25px #00ff4120;
            transform: translateY(-2px);
            color: #fff;
            text-shadow: 0 0 15px #00ff41;
        }
        .join-btn:hover::before {
            left: 100%;
        }
        .join-btn:active {
            transform: scale(0.97);
        }
        .whatsapp-icon {
            font-size: 1.3rem;
            filter: drop-shadow(0 0 5px #00ff41);
        }

        /* August badge */
        .august-badge {
            display: inline-block;
            padding: 8px 22px;
            border: 2px solid #ff00e540;
            border-radius: 25px;
            color: #ff00e5;
            font-size: 0.9rem;
            font-weight: bold;
            letter-spacing: 3px;
            text-shadow: 0 0 10px #ff00e580;
            box-shadow: 0 0 15px #ff00e520, inset 0 0 15px #ff00e510;
            background: rgba(255, 0, 229, 0.04);
            animation: badgeGlow 2.5s ease-in-out infinite;
            margin-top: 5px;
        }
        @keyframes badgeGlow {
            0%,
            100% {
                box-shadow: 0 0 15px #ff00e520, inset 0 0 15px #ff00e510;
            }
            50% {
                box-shadow: 0 0 30px #ff00e540, 0 0 50px #ff00e520, inset 0 0 25px #ff00e520;
            }
        }

        /* Barcode decoration */
        .barcode-decor {
            position: absolute;
            bottom: 20px;
            right: 30px;
            display: flex;
            gap: 2px;
            align-items: flex-end;
            height: 40px;
            z-index: 2;
            opacity: 0.5;
        }
        .barcode-decor .bar {
            background: #00ff4180;
            border-radius: 1px;
            box-shadow: 0 0 3px #00ff4140;
            width: 2px;
        }

        /* Magnetic stripe */
        .mag-stripe {
            position: absolute;
            top: 0;
            right: 30px;
            width: 55%;
            height: 100%;
            background: linear-gradient(180deg,
                    rgba(0, 0, 0, 0.4) 0%,
                    rgba(30, 30, 35, 0.5) 15%,
                    rgba(20, 20, 25, 0.45) 50%,
                    rgba(30, 30, 35, 0.5) 85%,
                    rgba(0, 0, 0, 0.4) 100%);
            z-index: 0;
            pointer-events: none;
            border-left: 1px solid rgba(255, 255, 255, 0.03);
        }

        /* Data streams */
        .data-stream {
            position: absolute;
            width: 1px;
            background: linear-gradient(180deg, transparent, #00ff4130, #00e5ff50, #00ff4130, transparent);
            z-index: 1;
            pointer-events: none;
            animation: dataFlow 3s linear infinite;
            opacity: 0;
        }
        @keyframes dataFlow {
            0% {
                top: -20%;
                opacity: 0;
            }
            20% {
                opacity: 0.6;
            }
            80% {
                opacity: 0.6;
            }
            100% {
                top: 120%;
                opacity: 0;
            }
        }

        /* Responsive */
        @media (max-width: 700px) {
            .card {
                width: 95vw;
                padding: 25px 20px 20px;
                min-height: 380px;
                border-radius: 16px;
            }
            .glitch-text {
                font-size: 1.2rem;
                letter-spacing: 1px;
            }
            .byline {
                font-size: 0.75rem;
                letter-spacing: 2px;
            }
            .invite-message {
                font-size: 0.9rem;
            }
            .join-btn {
                font-size: 0.9rem;
                padding: 10px 22px;
                letter-spacing: 1.5px;
            }
            .august-badge {
                font-size: 0.75rem;
                padding: 6px 16px;
                letter-spacing: 2px;
            }
            .corner-bracket {
                width: 20px;
                height: 20px;
            }
            .corner-bracket.top-left {
                top: 8px;
                left: 8px;
            }
            .corner-bracket.top-right {
                top: 8px;
                right: 8px;
            }
            .corner-bracket.bottom-left {
                bottom: 8px;
                left: 8px;
            }
            .corner-bracket.bottom-right {
                bottom: 8px;
                right: 8px;
            }
            .chip-decoration {
                top: 14px;
                left: 16px;
                width: 32px;
                height: 26px;
            }
            .chip-lines {
                top: 14px;
                left: 55px;
            }
            .chip-lines span {
                height: 26px;
            }
            .barcode-decor {
                bottom: 12px;
                right: 16px;
                height: 28px;
                gap: 1.5px;
            }
            .barcode-decor .bar {
                width: 1.5px;
            }
            .mag-stripe {
                right: 16px;
                width: 45%;
            }
            .divider {
                margin: 12px 0;
            }
        }
        @media (max-width: 400px) {
            .card {
                padding: 18px 14px 16px;
                min-height: 330px;
                border-radius: 14px;
            }
            .glitch-text {
                font-size: 0.95rem;
            }
            .byline {
                font-size: 0.65rem;
            }
            .invite-message {
                font-size: 0.8rem;
            }
            .join-btn {
                font-size: 0.8rem;
                padding: 8px 18px;
            }
            .august-badge {
                font-size: 0.7rem;
                padding: 5px 12px;
            }
        }
    </style>
</head>
<body>
    <canvas id="matrixCanvas"></canvas>
    <div class="scanlines"></div>
    <div class="crt-flicker"></div>
    <div class="vignette"></div>
    <div class="particles-container" id="particlesContainer"></div>

    <div class="card-wrapper" id="cardWrapper">
        <div class="card-border-glow"></div>
        <div class="card" id="card">
            <!-- Corner brackets -->
            <div class="corner-bracket top-left"></div>
            <div class="corner-bracket top-right"></div>
            <div class="corner-bracket bottom-left"></div>
            <div class="corner-bracket bottom-right"></div>

            <!-- Chip -->
            <div class="chip-decoration"></div>
            <div class="chip-lines">
                <span></span><span></span><span></span><span></span><span></span>
            </div>

            <!-- Magnetic stripe -->
            <div class="mag-stripe"></div>

            <!-- Barcode -->
            <div class="barcode-decor" id="barcodeDecor"></div>

            <!-- Data streams -->
            <div class="data-stream" style="left:15%;animation-delay:0s;"></div>
            <div class="data-stream" style="left:35%;animation-delay:1.5s;"></div>
            <div class="data-stream" style="left:55%;animation-delay:0.8s;"></div>
            <div class="data-stream" style="left:75%;animation-delay:2.1s;"></div>

            <!-- Card Content -->
            <div class="card-content">
                <!-- Glitch title -->
                <div class="glitch-container">
                    <span class="glitch-text">Power of Html, Css &amp; Js</span>
                    <span class="glitch-text clone-cyan" aria-hidden="true">Power of Html, Css &amp; Js</span>
                    <span class="glitch-text clone-magenta" aria-hidden="true">Power of Html, Css &amp; Js</span>
                </div>

                <!-- Byline -->
                <div class="byline">
                    by Bash2odes<span class="blink-cursor"></span>
                </div>

                <!-- Divider -->
                <div class="divider"></div>

                <!-- Invitation message -->
                <div class="invite-message">
                    <span class="prompt">$</span> Happy <span class="wave">👋</span> New Month, Fellows!
                </div>

                <!-- Fellows mention -->
                <div class="fellows-line">
                    [ ALL MY FELLOWS ARE INVITED ]
                </div>

                <!-- WhatsApp join button -->
                <a href="https://chat.whatsapp.com/BA4jQQel9yK6UEzBDtPBqr"
                   target="_blank"
                   rel="noopener noreferrer"
                   class="join-btn"
                   id="joinBtn">
                    <span class="whatsapp-icon">                   
                    </span> JOIN WHATSAPP GROUP
                </a>

                <!-- August badge -->
                <div class="august-badge">◆ AUGUST 2026 ◆</div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // Barcode decoration
            const barcodeDecor = document.getElementById('barcodeDecor');
            const barWidths = [2, 3, 1, 2, 4, 1, 2, 3, 2, 1, 3, 2, 4, 1, 2, 1, 3, 2, 1, 3, 2, 1, 4, 2, 1, 2, 3, 1, 2,
                1, 3, 2, 4, 1, 2, 3, 1, 2
            ];
            barWidths.forEach(w => {
                const bar = document.createElement('div');
                bar.className = 'bar';
                bar.style.width = w + 'px';
                bar.style.height = (Math.random() * 20 + 20) + 'px';
                barcodeDecor.appendChild(bar);
            });

            // Matrix rain
            const canvas = document.getElementById('matrixCanvas');
            const ctx = canvas.getContext('2d');

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resizeCanvas();
            window.addEventListener('resize', () => {
                resizeCanvas();
                initMatrix();
            });

            const chars = '01';
            const charArray = chars.split('');
            let fontSize = 16;
            let columns;
            let drops;

            function initMatrix() {
                if (window.innerWidth < 500) {
                    fontSize = 12;
                } else if (window.innerWidth < 800) {
                    fontSize = 14;
                } else {
                    fontSize = 16;
                }
                columns = Math.floor(canvas.width / fontSize);
                drops = [];
                for (let i = 0; i < columns; i++) {
                    drops[i] = Math.random() * -canvas.height / fontSize;
                }
            }
            initMatrix();
            window.addEventListener('resize', initMatrix);

            function drawMatrix() {
                ctx.fillStyle = 'rgba(5, 5, 8, 0.08)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.font = fontSize + 'px "Courier New", "Consolas", monospace';

                for (let i = 0; i < drops.length; i++) {
                    const text = charArray[Math.floor(Math.random() * charArray.length)];
                    const x = i * fontSize;
                    const y = drops[i] * fontSize;
                    const gradient = ctx.createLinearGradient(x, y - fontSize, x, y + fontSize);
                    gradient.addColorStop(0, 'rgba(180,255,200,0.15)');
                    gradient.addColorStop(0.3, 'rgba(0,255,65,0.7)');
                    gradient.addColorStop(0.7, 'rgba(0,200,50,0.35)');
                    gradient.addColorStop(1, 'rgba(0,40,10,0.05)');
                    ctx.fillStyle = gradient;
                    ctx.fillText(text, x, y);

                    ctx.fillStyle = 'rgba(200,255,220,0.9)';
                    ctx.shadowColor = '#00ff41';
                    ctx.shadowBlur = 8;
                    ctx.fillText(text, x, y);
                    ctx.shadowBlur = 0;

                    if (y > canvas.height && Math.random() > 0.975) {
                        drops[i] = 0;
                    }
                    drops[i] += 0.6 + Math.random() * 0.8;
                }
            }
            function animateMatrix() {
                drawMatrix();
                requestAnimationFrame(animateMatrix);
            }
            animateMatrix();

            // Floating particles
            const particlesContainer = document.getElementById('particlesContainer');
            const particleColors = ['particle', 'particle cyan', 'particle magenta'];

            function createParticle() {
                const particle = document.createElement('div');
                particle.className = particleColors[Math.floor(Math.random() * particleColors.length)];
                particle.style.left = Math.random() * 90 + '%';
                particle.style.bottom = '-10px';
                particle.style.animationDuration = (3 + Math.random() * 7) + 's';
                particle.style.animationDelay = Math.random() * 2 + 's';
                particle.style.width = (2 + Math.random() * 3) + 'px';
                particle.style.height = particle.style.width;
                particlesContainer.appendChild(particle);
                setTimeout(() => {
                    if (particle.parentNode) particle.remove();
                }, 12000);
            }
            setInterval(() => {
                if (particlesContainer.children.length < 35) createParticle();
            }, 400);
            for (let i = 0; i < 20; i++) {
                setTimeout(() => createParticle(), i * 250);
            }

            // 3D tilt
            const cardWrapper = document.getElementById('cardWrapper');
            const card = document.getElementById('card');
            const cardBorderGlow = document.querySelector('.card-border-glow');

            cardWrapper.addEventListener('mousemove', (e) => {
                const rect = cardWrapper.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                const rotateY = ((x - centerX) / centerX) * 7;
                const rotateX = ((centerY - y) / centerY) * 7;
                card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
                cardBorderGlow.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
            });
            cardWrapper.addEventListener('mouseleave', () => {
                card.style.transform = 'rotateX(0deg) rotateY(0deg)';
                cardBorderGlow.style.transform = 'rotateX(0deg) rotateY(0deg)';
                card.style.transition = 'transform 0.5s ease, box-shadow 0.5s ease';
                cardBorderGlow.style.transition = 'transform 0.5s ease';
                setTimeout(() => {
                    card.style.transition = 'transform 0.15s ease-out, box-shadow 0.3s ease';
                    cardBorderGlow.style.transition = 'transform 0.15s ease-out';
                }, 500);
            });

            // Touch tilt
            cardWrapper.addEventListener('touchmove', (e) => {
                const touch = e.touches[0];
                const rect = cardWrapper.getBoundingClientRect();
                const x = touch.clientX - rect.left;
                const y = touch.clientY - rect.top;
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                const rotateY = ((x - centerX) / centerX) * 5;
                const rotateX = ((centerY - y) / centerY) * 5;
                card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
            });
            cardWrapper.addEventListener('touchend', () => {
                card.style.transform = 'rotateX(0deg) rotateY(0deg)';
            });

            // Glitch on 'H' key
            document.addEventListener('keydown', (e) => {
                if (e.key.toLowerCase() === 'h') {
                    card.style.boxShadow =
                        '0 0 40px #ff00e5, 0 0 80px #00e5ff, 0 0 120px #00ff41, 0 25px 70px rgba(0,0,0,0.8)';
                    setTimeout(() => {
                        card.style.boxShadow = '';
                    }, 600);
                }
            });

            console.log('%c📡  Power of Html, Css & Js  %c|  %cBash2odes  %c|  %cAugust 2026 💾',
                'color:#00ff41;font-size:18px;font-weight:bold;',
                '', 'color:#00e5ff;font-size:14px;', '',
                'color:#ff00e5;font-size:14px;font-weight:bold;');
            console.log('%c👾  Happy New Month, Fellows!  %c🚀',
                'color:#00ff41;font-size:16px;text-shadow:0 0 10px #00ff41;', '');
            console.log('%c💬  Join the group: https://chat.whatsapp.com/BA4jQQel9yK6UEzBDtPBqr',
                'color:#00e5ff;font-size:12px;');
        })();
    </script>
</body>
</html>
